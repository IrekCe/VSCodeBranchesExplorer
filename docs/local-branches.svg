<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg{fill:#1e1e1e}
    .panel{fill:#252526}
    .header{fill:#181818}
    .hdr-text{fill:#cccccc;font-size:11px;font-weight:600;letter-spacing:.5px}
    .row-text{fill:#cccccc}
    .muted{fill:#858585;font-size:11px}
    .accent{fill:#3794ff}
    .danger{fill:#f14c4c}
    .ok{fill:#89d185}
    .icon-btn{fill:#858585}
    .row-hover{fill:#2a2d2e}
    .sep{stroke:#2d2d2d;stroke-width:1}
    .chev{stroke:#cccccc;stroke-width:1.4;fill:none}
  </style>

  <rect class="bg" width="520" height="360"/>

  <!-- Section header -->
  <rect class="header" x="0" y="0" width="520" height="22"/>
  <polyline class="chev" points="8,9 12,13 16,9"/>
  <text class="hdr-text" x="22" y="15">LOCAL BRANCHES</text>
  <!-- title-bar inline icons -->
  <g transform="translate(450,4)">
    <text class="icon-btn" x="0" y="11" font-family="codicon">＋</text>
    <text class="icon-btn" x="18" y="11" font-family="codicon">⇄</text>
    <text class="icon-btn" x="36" y="11" font-family="codicon">▽</text>
    <text class="icon-btn" x="54" y="11" font-family="codicon">↻</text>
  </g>

  <!-- Rows -->
  <!-- current branch (hovered) -->
  <rect class="row-hover" x="0" y="30" width="520" height="22"/>
  <text x="14" y="45" class="ok">✓</text>
  <text x="32" y="45" class="row-text">main</text>
  <text x="74" y="45" class="muted">a3f12c8 • current • ↑2</text>
  <g transform="translate(460,34)">
    <text class="icon-btn" x="0"  y="11">↑</text>
    <text class="icon-btn" x="22" y="11">↓</text>
  </g>

  <!-- branch -->
  <text x="14" y="69" class="accent">⎇</text>
  <text x="32" y="69" class="row-text">feature/asset-history</text>
  <text x="180" y="69" class="muted">9bc1d4e • ↑5 ↓1</text>

  <!-- branch -->
  <text x="14" y="93" class="accent">⎇</text>
  <text x="32" y="93" class="row-text">fix/calculation-formula-dates</text>
  <text x="226" y="93" class="muted">12ab3f0 • ↓3</text>

  <!-- hovered with inline action icons -->
  <rect class="row-hover" x="0" y="102" width="520" height="22"/>
  <text x="14" y="117" class="accent">⎇</text>
  <text x="32" y="117" class="row-text">fix/sidebar-padding</text>
  <text x="174" y="117" class="muted">dd4e887 • ↓1</text>
  <g transform="translate(460,106)">
    <text class="icon-btn" x="0"  y="11">✓</text>
    <text class="danger"   x="22" y="11">🗑</text>
  </g>

  <text x="14" y="141" class="accent">⎇</text>
  <text x="32" y="141" class="row-text">refactor/global-usings</text>
  <text x="190" y="141" class="muted">5520ee1</text>

  <text x="14" y="165" class="accent">⎇</text>
  <text x="32" y="165" class="row-text">vscode-extensions</text>
  <text x="160" y="165" class="muted">7c0aa92 • ↑1</text>

  <text x="14" y="189" class="accent">⎇</text>
  <text x="32" y="189" class="row-text">wolverine-handler-cleanup</text>
  <text x="206" y="189" class="muted">e44b330</text>

  <!-- Filter line -->
  <rect class="header" x="0" y="334" width="520" height="26"/>
  <text x="12" y="351" class="muted">Filter: fix</text>
</svg>
