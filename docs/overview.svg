<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 600" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <style>
    .bg{fill:#1e1e1e}
    .header{fill:#181818}
    .sb-title{fill:#cccccc;font-size:11px;font-weight:600;letter-spacing:.5px}
    .sb-section{fill:#cccccc;font-size:11px;font-weight:600;letter-spacing:.5px}
    .row-text{fill:#cccccc}
    .muted{fill:#858585;font-size:11px}
    .accent{fill:#3794ff}
    .ok{fill:#89d185}
    .tag{fill:#dcdcaa}
    .danger{fill:#f14c4c}
    .icon-btn{fill:#858585}
    .row-hover{fill:#2a2d2e}
    .chev{stroke:#cccccc;stroke-width:1.4;fill:none}
    .div{stroke:#2d2d2d;stroke-width:1}
  </style>

  <rect class="bg" width="380" height="600"/>

  <!-- Source Control title -->
  <rect class="header" x="0" y="0" width="380" height="28"/>
  <text x="12" y="18" class="sb-title">SOURCE CONTROL</text>

  <!-- Built-in Changes section (collapsed-ish placeholder) -->
  <rect class="header" x="0" y="28" width="380" height="22"/>
  <polyline class="chev" points="8,37 14,41 20,37"/>
  <text x="28" y="43" class="sb-section">CHANGES</text>

  <!-- LOCAL BRANCHES -->
  <rect class="header" x="0" y="60" width="380" height="22"/>
  <polyline class="chev" points="8,69 14,73 20,69"/>
  <text x="28" y="75" class="sb-section">LOCAL BRANCHES</text>
  <g transform="translate(290,64)">
    <text class="icon-btn" x="0"  y="11">＋</text>
    <text class="icon-btn" x="20" y="11">⇄</text>
    <text class="icon-btn" x="40" y="11">▽</text>
    <text class="icon-btn" x="60" y="11">↻</text>
  </g>

  <text x="14" y="98" class="ok">✓</text>
  <text x="32" y="98" class="row-text">main</text>
  <text x="74" y="98" class="muted">a3f12c8 • current • ↑2</text>

  <text x="14" y="120" class="accent">⎇</text>
  <text x="32" y="120" class="row-text">feature/asset-history</text>
  <text x="180" y="120" class="muted">9bc1d4e</text>

  <rect class="row-hover" x="0" y="128" width="380" height="22"/>
  <text x="14" y="143" class="accent">⎇</text>
  <text x="32" y="143" class="row-text">fix/sidebar-padding</text>
  <text x="174" y="143" class="muted">dd4e887 • ↓1</text>
  <g transform="translate(320,132)">
    <text class="icon-btn" x="0"  y="11">✓</text>
    <text class="danger"   x="22" y="11">🗑</text>
  </g>

  <text x="14" y="166" class="accent">⎇</text>
  <text x="32" y="166" class="row-text">vscode-extensions</text>
  <text x="160" y="166" class="muted">7c0aa92 • ↑1</text>

  <!-- REMOTE BRANCHES -->
  <line class="div" x1="0" y1="180" x2="380" y2="180"/>
  <rect class="header" x="0" y="180" width="380" height="22"/>
  <polyline class="chev" points="8,189 14,193 20,189"/>
  <text x="28" y="195" class="sb-section">REMOTE BRANCHES</text>
  <g transform="translate(310,184)">
    <text class="icon-btn" x="0"  y="11">⤓</text>
    <text class="icon-btn" x="20" y="11">▽</text>
    <text class="icon-btn" x="40" y="11">↻</text>
  </g>

  <polyline class="chev" points="10,218 14,222 18,218"/>
  <text x="26" y="225" class="row-text">☁ origin</text>
  <text x="100" y="225" class="muted">5 branches</text>

  <text x="40" y="247" class="accent">⎇</text>
  <text x="58" y="247" class="row-text">main</text>
  <text x="100" y="247" class="muted">a3f12c8</text>

  <text x="40" y="269" class="accent">⎇</text>
  <text x="58" y="269" class="row-text">feature/asset-history</text>
  <text x="206" y="269" class="muted">9bc1d4e</text>

  <text x="40" y="291" class="accent">⎇</text>
  <text x="58" y="291" class="row-text">fix/sidebar-padding</text>
  <text x="200" y="291" class="muted">dd4e887</text>

  <polyline class="chev" points="10,310 14,314 18,310"/>
  <text x="26" y="317" class="row-text">☁ upstream</text>
  <text x="120" y="317" class="muted">2 branches</text>

  <text x="40" y="339" class="accent">⎇</text>
  <text x="58" y="339" class="row-text">main</text>
  <text x="100" y="339" class="muted">88ee010</text>

  <!-- TAGS -->
  <line class="div" x1="0" y1="354" x2="380" y2="354"/>
  <rect class="header" x="0" y="354" width="380" height="22"/>
  <polyline class="chev" points="8,363 14,367 20,363"/>
  <text x="28" y="369" class="sb-section">TAGS</text>
  <g transform="translate(310,358)">
    <text class="icon-btn" x="0"  y="11">＋</text>
    <text class="icon-btn" x="20" y="11">▽</text>
    <text class="icon-btn" x="40" y="11">↻</text>
  </g>

  <text x="14" y="392" class="tag">⌂</text>
  <text x="32" y="392" class="row-text">v2026.04.0</text>
  <text x="120" y="392" class="muted">a3f12c8</text>

  <text x="14" y="414" class="tag">⌂</text>
  <text x="32" y="414" class="row-text">v2026.03.2</text>
  <text x="120" y="414" class="muted">88ee010</text>

  <text x="14" y="436" class="tag">⌂</text>
  <text x="32" y="436" class="row-text">v2026.03.1</text>
  <text x="120" y="436" class="muted">cc73441</text>

  <text x="14" y="458" class="tag">⌂</text>
  <text x="32" y="458" class="row-text">v2026.03.0</text>
  <text x="120" y="458" class="muted">12ab3f0</text>
</svg>
