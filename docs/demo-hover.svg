<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <!--
    Animated demo: simulates a user hovering over the third row.
    The hover highlight + inline icons fade in/out on a 6s loop.
    Pure CSS keyframes → renders in GitHub & VS Code Markdown previews.
  -->
  <style>
    .bg{fill:#1e1e1e}
    .header{fill:#181818}
    .hdr-text{fill:#cccccc;font-size:11px;font-weight:600;letter-spacing:.5px}
    .row-text{fill:#cccccc}
    .muted{fill:#858585;font-size:11px}
    .accent{fill:#3794ff}
    .danger{fill:#f14c4c}
    .ok{fill:#89d185}
    .icon-btn{fill:#858585}
    .chev{stroke:#cccccc;stroke-width:1.4;fill:none}
    .cursor{fill:#ffffff;stroke:#000000;stroke-width:.7}

    /* Hover highlight + inline icons fade in/out on a 6s loop. */
    @keyframes hoverPulse {
      0%, 35%   { opacity: 0; }
      45%, 80%  { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    @keyframes cursorMove {
      0%   { transform: translate(490px, 60px); }
      35%  { transform: translate(380px, 137px); }
      80%  { transform: translate(380px, 137px); }
      100% { transform: translate(490px, 60px); }
    }
    .hover-fx { opacity: 0; animation: hoverPulse 6s ease-in-out infinite; }
    .cursor   { animation: cursorMove 6s ease-in-out infinite; transform-origin: 0 0; }
  </style>

  <rect class="bg" width="560" height="280"/>

  <!-- Section header -->
  <rect class="header" x="0" y="0" width="560" height="22"/>
  <polyline class="chev" points="8,9 12,13 16,9"/>
  <text class="hdr-text" x="22" y="15">LOCAL BRANCHES</text>
  <g transform="translate(490,4)">
    <text class="icon-btn" x="0"  y="11">＋</text>
    <text class="icon-btn" x="18" y="11">⇄</text>
    <text class="icon-btn" x="36" y="11">▽</text>
    <text class="icon-btn" x="54" y="11">↻</text>
  </g>

  <!-- Row 1: current -->
  <text x="14" y="45" class="ok">✓</text>
  <text x="32" y="45" class="row-text">main</text>
  <text x="74" y="45" class="muted">a3f12c8 • current • Irek Matysiewicz • 3h ago</text>

  <!-- Row 2 -->
  <text x="14" y="69" class="accent">⎇</text>
  <text x="32" y="69" class="row-text">feature/asset-history</text>
  <text x="180" y="69" class="muted">9bc1d4e • ↑5 ↓1 • Anna Kowalska • 1d ago</text>

  <!-- Row 3 — hovered -->
  <g class="hover-fx">
    <rect fill="#2a2d2e" x="0" y="102" width="560" height="22"/>
  </g>
  <text x="14" y="117" class="accent">⎇</text>
  <text x="32" y="117" class="row-text">fix/sidebar-padding</text>
  <text x="174" y="117" class="muted">dd4e887 • ↓1 • Pawel Nowak • 5h ago</text>
  <g class="hover-fx" transform="translate(500,106)">
    <text class="icon-btn" x="0"  y="11">✓</text>
    <text class="danger"   x="22" y="11">🗑</text>
  </g>

  <!-- Row 4 -->
  <text x="14" y="141" class="accent">⎇</text>
  <text x="32" y="141" class="row-text">refactor/global-usings</text>
  <text x="190" y="141" class="muted">5520ee1 • Irek Matysiewicz • 2d ago</text>

  <!-- Row 5 -->
  <text x="14" y="165" class="accent">⎇</text>
  <text x="32" y="165" class="row-text">vscode-extensions</text>
  <text x="160" y="165" class="muted">7c0aa92 • ↑1 • Irek Matysiewicz • just now</text>

  <!-- Row 6 -->
  <text x="14" y="189" class="accent">⎇</text>
  <text x="32" y="189" class="row-text">wolverine-handler-cleanup</text>
  <text x="206" y="189" class="muted">e44b330 • Anna Kowalska • 1w ago</text>

  <!-- Caption -->
  <text x="14" y="240" class="muted">Hover a branch → inline Checkout &amp; Delete icons fade in.</text>
  <text x="14" y="258" class="muted">Author + relative date appear in the row's description (cached lazily).</text>

  <!-- Animated cursor -->
  <path class="cursor" d="M0,0 L0,16 L4,12 L7,18 L9,17 L6,11 L11,11 Z"/>
</svg>
